<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявка на партнёрский доступ · WOWSHIMMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a; --ink-2: #141414; --gold: #c9a96e; --gold-deep: #8a7651;
    --white: #ffffff; --w-92: rgba(255,255,255,0.92); --w-72: rgba(255,255,255,0.72);
    --w-55: rgba(255,255,255,0.55); --w-40: rgba(255,255,255,0.40);
    --w-22: rgba(255,255,255,0.22); --w-12: rgba(255,255,255,0.12); --w-6: rgba(255,255,255,0.06);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { background: var(--ink); color: var(--w-92); font-family: var(--font-body); line-height: 1.5; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 40px; width: 100%; }

  /* HEADER */
  .site-header { position: sticky; top: 0; z-index: 50; padding: 18px 0; background: var(--ink); border-bottom: 1px solid var(--w-12); }
  .header-row { display: flex; align-items: center; gap: 40px; }
  .logo { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--white); letter-spacing: 4px; text-transform: uppercase; line-height: 1; }
  .logo:hover { color: var(--gold); }
  .nav-menu { display: flex; gap: 32px; margin-left: auto; }
  .nav-menu a { color: var(--w-72); font-size: 13px; font-weight: 400; letter-spacing: 1.2px; text-transform: uppercase; transition: color 0.2s; padding: 4px 0; position: relative; }
  .nav-menu a::after { content: ''; position: absolute; left: 50%; right: 50%; bottom: -2px; height: 1px; background: var(--gold); transition: left 0.25s, right 0.25s; }
  .nav-menu a:hover { color: var(--white); }
  .nav-menu a:hover::after { left: 0; right: 0; }
  .header-actions { display: flex; align-items: center; gap: 4px; }
  .header-icon { position: relative; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; color: var(--white); transition: color 0.2s; flex-shrink: 0; background: transparent; border: none; cursor: pointer; }
  .header-icon.active { color: var(--gold); }
  .header-icon:hover { color: var(--gold); }
  .header-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; display: block; }
  .header-divider { width: 1px; height: 22px; background: var(--w-22); margin: 0 4px; flex-shrink: 0; }
  .fav-badge { position: absolute; top: -2px; right: -4px; min-width: 18px; height: 18px; background: var(--gold); color: var(--ink); font-size: 10px; font-weight: 700; border-radius: 9px; padding: 0 5px; display: none; align-items: center; justify-content: center; line-height: 1; border: 2px solid var(--ink); }
  .fav-badge.show { display: inline-flex; }

  /* PAGE */
  .reg-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 24px; position: relative; overflow: hidden; }
  .reg-page::before, .reg-page::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(201,169,110,0.10) 0%, transparent 70%);
  }
  .reg-page::before { width: 600px; height: 600px; top: -200px; left: -200px; }
  .reg-page::after { width: 500px; height: 500px; bottom: -150px; right: -150px; }

  .reg-card {
    width: 100%;
    max-width: 580px;
    background: rgba(20, 20, 20, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--w-12);
    padding: 56px 60px 48px;
    position: relative;
    z-index: 1;
  }

  .reg-card h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(30px, 3.2vw, 40px);
    color: var(--white);
    text-align: center;
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }
  .reg-sub {
    text-align: center;
    font-size: 14px;
    color: var(--w-55);
    line-height: 1.6;
    margin-bottom: 36px;
    font-weight: 300;
  }

  .reg-form { display: flex; flex-direction: column; gap: 16px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .field { position: relative; }
  .field label {
    position: absolute;
    top: 14px; left: 16px;
    font-size: 11px;
    color: var(--w-55);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
    pointer-events: none;
    transition: top 0.2s, font-size 0.2s, color 0.2s;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    background: transparent;
    border: 1px solid var(--w-22);
    color: var(--white);
    font: 400 15px/1.4 var(--font-body);
    padding: 28px 16px 14px;
    transition: border-color 0.2s;
  }
  .field textarea { resize: vertical; min-height: 110px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
  .field input:not(:placeholder-shown) ~ label,
  .field input:focus ~ label,
  .field textarea:not(:placeholder-shown) ~ label,
  .field textarea:focus ~ label,
  .field select.has-value ~ label,
  .field select:focus ~ label {
    top: 8px; font-size: 9px; color: var(--gold);
  }
  .field select {
    appearance: none;
    color: var(--white);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23c9a96e' stroke-width='1.5'><path d='M1 1.5 L6 6 L11 1.5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 12px;
    cursor: pointer;
  }
  .field select option { background: var(--ink-2); color: var(--white); }

  .agree {
    display: inline-flex;
    align-items: flex-start;
    gap: 10px;
    margin: 14px 0 4px;
    font-size: 12px;
    color: var(--w-72);
    cursor: pointer;
    user-select: none;
    line-height: 1.5;
  }
  .agree input { appearance: none; -webkit-appearance: none; }
  .agree .box {
    width: 16px; height: 16px;
    border: 1px solid var(--w-22);
    background: transparent;
    position: relative;
    flex-shrink: 0;
    margin-top: 2px;
    transition: background 0.2s, border-color 0.2s;
  }
  .agree input:checked ~ .box {
    background: var(--gold);
    border-color: var(--gold);
  }
  .agree input:checked ~ .box::after {
    content: '';
    position: absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border: solid var(--ink);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .agree a { color: var(--gold); border-bottom: 1px solid currentColor; }
  .agree a:hover { color: var(--white); }

  .btn-submit {
    width: 100%;
    padding: 17px 24px;
    background: var(--gold);
    color: var(--ink);
    font: 600 12px/1 var(--font-body);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border: none;
    transition: background 0.2s;
    margin-top: 12px;
  }
  .btn-submit:hover { background: var(--white); }
  .btn-submit:disabled { background: var(--w-22); color: var(--w-55); cursor: not-allowed; }

  .reg-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 32px 0 22px;
    color: var(--w-40);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .reg-divider::before, .reg-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--w-12);
  }

  .login-link { text-align: center; font-size: 13px; color: var(--w-55); }
  .login-link a { color: var(--gold); border-bottom: 1px solid currentColor; transition: color 0.2s; }
  .login-link a:hover { color: var(--white); }

  /* Success state */
  .reg-success {
    text-align: center;
    padding: 20px 0;
  }
  .reg-success .checkmark {
    width: 64px; height: 64px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
  }
  .reg-success .checkmark svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2; }
  .reg-success h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 32px;
    color: var(--white);
    margin-bottom: 14px;
    line-height: 1.15;
  }
  .reg-success p {
    font-size: 14px;
    color: var(--w-72);
    line-height: 1.7;
    margin-bottom: 32px;
    font-weight: 300;
  }
  .reg-success .back-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border: 1px solid var(--w-22);
    color: var(--white);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s;
  }
  .reg-success .back-link:hover { background: rgba(201,169,110,0.10); border-color: var(--gold); }

  /* FOOTER */
  .site-footer { background: var(--ink); color: var(--w-72); padding: 32px 0; border-top: 1px solid var(--w-12); }
  .footer-bottom { display: flex; justify-content: space-between; gap: 24px; font-size: 12px; color: var(--w-40); }
  .footer-bottom a { color: var(--w-55); }
  .footer-bottom a:hover { color: var(--white); }

  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
    .nav-menu { display: none; }
    .reg-card { padding: 36px 28px 32px; }
    .field-row { grid-template-columns: 1fr; }
    .reg-page { padding: 30px 16px; }
    .footer-bottom { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="wrap header-row">
    <a href="./" class="logo">WOWSHIMMER</a>
    <nav class="nav-menu">
      <a href="catalog/">Каталог</a>
      <a href="#about">О бренде</a>
      <a href="#partners">Партнёрам</a>
      <a href="#contacts">Контакты</a>
    </nav>
    <div class="header-actions">
      <a href="catalog/favorites.html" class="header-icon" title="Избранное">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.5-8.5-9.5C2.3 7.8 4.5 5 7.5 5c1.8 0 3.5 1 4.5 2.5C13 6 14.7 5 16.5 5c3 0 5.2 2.8 4 6.5C18.5 16.5 12 21 12 21z"/></svg>
        <span class="fav-badge" id="fav-badge">0</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <a href="login.html" class="header-icon active" title="Вход для партнёров">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>
      </a>
    </div>
  </div>
</header>

<!-- FORM -->
<section class="reg-page">
  <div class="reg-card" id="card">
    <h1>Заявка на&nbsp;партнёрский доступ</h1>
    <p class="reg-sub">
      Заполните форму — менеджер свяжется в&nbsp;течение рабочего дня, чтобы уточнить детали
      и&nbsp;открыть доступ к&nbsp;оптовому каталогу.
    </p>

    <form class="reg-form" id="reg-form" autocomplete="on">
      <div class="field-row">
        <div class="field">
          <input type="text" id="name" name="name" placeholder=" " autocomplete="name" required>
          <label for="name">Имя контактного лица</label>
        </div>
        <div class="field">
          <input type="tel" id="phone" name="phone" placeholder=" " autocomplete="tel" required>
          <label for="phone">Телефон</label>
        </div>
      </div>

      <div class="field">
        <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
        <label for="email">E-mail</label>
      </div>

      <div class="field">
        <input type="text" id="company" name="company" placeholder=" " autocomplete="organization" required>
        <label for="company">Название магазина / бренда</label>
      </div>

      <div class="field-row">
        <div class="field">
          <select id="format" name="format" required>
            <option value="" disabled selected hidden></option>
            <option value="showroom-clothes">Шоурум одежды</option>
            <option value="showroom-acc">Шоурум аксессуаров</option>
            <option value="beauty">Салон красоты</option>
            <option value="other">Другое</option>
          </select>
          <label for="format">Формат площадки</label>
        </div>
        <div class="field">
          <input type="text" id="city" name="city" placeholder=" " autocomplete="address-level2" required>
          <label for="city">Город</label>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <input type="url" id="link" name="link" placeholder=" ">
          <label for="link">Сайт / Instagram / VK / TG</label>
        </div>
        <div class="field">
          <input type="text" id="inn" name="inn" placeholder=" " inputmode="numeric" pattern="[0-9]{10,12}">
          <label for="inn">ИНН</label>
        </div>
      </div>

      <label class="agree">
        <input type="checkbox" name="agree" required>
        <span class="box"></span>
        <span>Согласен на&nbsp;<a href="#">обработку персональных данных</a> и&nbsp;получение ответа на&nbsp;указанные контакты.</span>
      </label>

      <button type="submit" class="btn-submit">Отправить заявку</button>
    </form>

    <div class="reg-divider">или</div>

    <div class="login-link">
      Уже есть доступ? <a href="login.html">Войти в&nbsp;кабинет</a>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <div>© WOWSHIMMER, 2026</div>
      <div><a href="#">Политика конфиденциальности</a></div>
    </div>
  </div>
</footer>

<script>
  // Favorites badge sync
  (function() {
    const FAVS_KEY = 'wowshimmer-favs';
    function getFavs() { try { return JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'); } catch { return []; } }
    const badge = document.getElementById('fav-badge');
    if (badge) {
      const n = getFavs().length;
      badge.textContent = n;
      badge.classList.toggle('show', n > 0);
    }
  })();

  // Make select toggle label up like inputs
  const selectEl = document.getElementById('format');
  selectEl.addEventListener('change', () => {
    selectEl.classList.toggle('has-value', !!selectEl.value);
  });

  // Demo submit — show success state
  document.getElementById('reg-form').addEventListener('submit', e => {
    e.preventDefault();
    const card = document.getElementById('card');
    const name = (document.getElementById('name').value || 'партнёр').split(' ')[0];
    card.innerHTML = `
      <div class="reg-success">
        <div class="checkmark">
          <svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 8"/></svg>
        </div>
        <h2>Заявка отправлена!</h2>
        <p>Спасибо, ${name}!<br>Менеджер свяжется с&nbsp;вами в&nbsp;течение рабочего дня — обычно это занимает 2–4&nbsp;часа в&nbsp;рабочее время.</p>
        <a href="./" class="back-link">Вернуться на&nbsp;главную</a>
      </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

<script src="partner.js"></script>
<script src="modals.js"></script>
</body>
</html>
