<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подборка · WOWSHIMMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a; --ink-2: #141414; --gold: #c9a96e; --gold-deep: #8a7651;
    --white: #ffffff; --w-92: rgba(255,255,255,0.92); --w-72: rgba(255,255,255,0.72);
    --w-55: rgba(255,255,255,0.55); --w-40: rgba(255,255,255,0.40);
    --w-22: rgba(255,255,255,0.22); --w-12: rgba(255,255,255,0.12); --w-6: rgba(255,255,255,0.06);
    --light: #fafaf7;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { background: var(--light); color: var(--ink); font-family: var(--font-body); line-height: 1.5; overflow-x: hidden; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 40px; }

  /* HEADER */
  .site-header { position: sticky; top: 0; z-index: 50; padding: 18px 0; background: var(--ink); border-bottom: 1px solid var(--w-12); }
  .header-row { display: flex; align-items: center; gap: 40px; position: relative; }
  .logo { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--white); letter-spacing: 4px; text-transform: uppercase; line-height: 1; }
  .logo:hover { color: var(--gold); }
  .nav-menu { display: flex; gap: 32px; margin-left: auto; }
  .nav-menu a { color: var(--w-72); font-size: 13px; font-weight: 400; letter-spacing: 1.2px; text-transform: uppercase; transition: color 0.2s; padding: 4px 0; position: relative; }
  .nav-menu a::after { content: ''; position: absolute; left: 50%; right: 50%; bottom: -2px; height: 1px; background: var(--gold); transition: left 0.25s, right 0.25s; }
  .nav-menu a:hover { color: var(--white); }
  .nav-menu a:hover::after { left: 0; right: 0; }
  .header-actions { display: flex; align-items: center; gap: 4px; }
  .header-icon { position: relative; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; color: var(--white); transition: color 0.2s; flex-shrink: 0; background: transparent; border: none; cursor: pointer; }
  .header-icon:hover { color: var(--gold); }
  .header-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; display: block; }
  .header-divider { width: 1px; height: 22px; background: var(--w-22); margin: 0 4px; flex-shrink: 0; }
  .fav-badge { position: absolute; top: -2px; right: -4px; min-width: 18px; height: 18px; background: var(--gold); color: var(--ink); font-size: 10px; font-weight: 700; border-radius: 9px; padding: 0 5px; display: none; align-items: center; justify-content: center; line-height: 1; border: 2px solid var(--ink); }
  .fav-badge.show { display: inline-flex; }

  /* PAGE */
  .cart-page { padding: 60px 0 100px; }
  .cart-head {
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
  }
  .cart-head h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(36px, 4vw, 52px);
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .cart-head .count { font-size: 13px; color: rgba(0,0,0,0.55); }
  .cart-head .count b { color: var(--ink); font-weight: 600; }

  .cart-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 48px;
    align-items: start;
  }

  /* Items */
  .cart-items { display: flex; flex-direction: column; gap: 16px; }
  .cart-item {
    background: white;
    border: 1px solid rgba(0,0,0,0.06);
    display: grid;
    grid-template-columns: 110px 1fr auto;
    gap: 20px;
    padding: 16px;
    align-items: center;
  }
  .cart-item .ph {
    width: 110px; height: 110px;
    background: #f9f7f1;
    overflow: hidden;
  }
  .cart-item .ph img { width: 100%; height: 100%; object-fit: cover; }
  .cart-item .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cart-item .name { font-family: var(--font-display); font-size: 20px; font-weight: 400; color: var(--ink); line-height: 1.2; letter-spacing: -0.2px; }
  .cart-item .params {
    font-size: 12px;
    color: rgba(0,0,0,0.55);
    letter-spacing: 0.3px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 4px;
  }
  .cart-item .params .sw {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.10);
    vertical-align: middle;
    margin-right: 5px;
  }
  .cart-item .actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .cart-item .qty-ctrl {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(0,0,0,0.18);
  }
  .cart-item .qty-ctrl button {
    width: 32px; height: 32px;
    background: transparent;
    border: none;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s;
  }
  .cart-item .qty-ctrl button:hover { background: rgba(0,0,0,0.06); }
  .cart-item .qty-ctrl input {
    width: 44px; height: 32px;
    text-align: center;
    border: none;
    border-left: 1px solid rgba(0,0,0,0.18);
    border-right: 1px solid rgba(0,0,0,0.18);
    font: 500 13px/1 var(--font-body);
    background: transparent;
    -moz-appearance: textfield;
  }
  .cart-item .qty-ctrl input::-webkit-outer-spin-button,
  .cart-item .qty-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cart-item .price { font-size: 15px; font-weight: 600; color: var(--ink); }
  .cart-item .remove {
    background: transparent;
    border: none;
    color: rgba(0,0,0,0.40);
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: color 0.2s;
    padding: 4px 0;
  }
  .cart-item .remove:hover { color: #c34; }

  /* Sidebar */
  .cart-summary {
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    padding: 28px 28px 32px;
    position: sticky;
    top: 80px;
  }
  .cart-summary h3 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    font-size: 14px;
    color: rgba(0,0,0,0.65);
  }
  .summary-row.total {
    margin-top: 8px;
    padding-top: 14px;
    border-top: 1px solid rgba(0,0,0,0.08);
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
  }
  .summary-row.total .val { font-size: 22px; font-weight: 700; }

  /* Min sum progress */
  .min-sum-block { margin: 20px 0 22px; }
  .min-sum-label {
    font-size: 12px;
    color: rgba(0,0,0,0.65);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .min-sum-label b { color: var(--ink); font-weight: 600; }
  .min-sum-bar {
    height: 6px;
    background: rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .min-sum-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold));
    transition: width 0.4s ease;
  }
  .min-sum-bar.full .fill { background: linear-gradient(90deg, #4a8e4a, #6ab06a); }
  .min-sum-hint {
    font-size: 12px;
    color: rgba(0,0,0,0.55);
    margin-top: 8px;
    line-height: 1.4;
  }
  .min-sum-hint.ok { color: #4a8e4a; font-weight: 500; }

  /* Send form */
  .send-form { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .send-form .field { position: relative; }
  .send-form .field label {
    position: absolute; top: 11px; left: 14px;
    font-size: 10px;
    color: rgba(0,0,0,0.50);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 500;
    pointer-events: none;
    transition: top 0.2s, font-size 0.2s, color 0.2s;
  }
  .send-form input, .send-form textarea {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(0,0,0,0.18);
    color: var(--ink);
    font: 400 13px/1.4 var(--font-body);
    padding: 22px 13px 10px;
    transition: border-color 0.2s;
  }
  .send-form textarea { resize: vertical; min-height: 70px; }
  .send-form input:focus, .send-form textarea:focus { outline: none; border-color: var(--gold-deep); }
  .send-form .field input:not(:placeholder-shown) ~ label,
  .send-form .field input:focus ~ label,
  .send-form .field textarea:not(:placeholder-shown) ~ label,
  .send-form .field textarea:focus ~ label { top: 6px; font-size: 8px; color: var(--gold-deep); }

  .btn-send {
    width: 100%;
    padding: 17px 24px;
    background: var(--ink);
    color: white;
    font: 600 12px/1 var(--font-body);
    letter-spacing: 2px; text-transform: uppercase;
    border: none;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 12px;
  }
  .btn-send:hover:not(:disabled) { background: var(--gold-deep); }
  .btn-send:disabled { background: rgba(0,0,0,0.20); color: rgba(255,255,255,0.65); cursor: not-allowed; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 100px 24px;
    background: white;
    border: 1px dashed rgba(0,0,0,0.12);
  }
  .empty svg { width: 56px; height: 56px; fill: none; stroke: rgba(0,0,0,0.20); stroke-width: 1.5; margin: 0 auto 24px; display: block; }
  .empty h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ink); margin-bottom: 10px; }
  .empty p { font-size: 14px; color: rgba(0,0,0,0.55); margin-bottom: 28px; line-height: 1.6; }
  .empty .btn-cta { display: inline-block; padding: 14px 32px; background: var(--ink); color: white; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: background 0.2s; }
  .empty .btn-cta:hover { background: var(--gold-deep); }

  /* Success state */
  .success {
    text-align: center;
    padding: 80px 24px;
    background: white;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .success .check {
    width: 72px; height: 72px;
    border: 1.5px solid var(--gold-deep);
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-deep);
  }
  .success .check svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2; }
  .success h2 { font-family: var(--font-display); font-weight: 400; font-size: 36px; color: var(--ink); margin-bottom: 14px; line-height: 1.1; }
  .success p { font-size: 14px; color: rgba(0,0,0,0.65); max-width: 480px; margin: 0 auto 28px; line-height: 1.7; }

  /* Not authenticated guard */
  .auth-required {
    text-align: center;
    padding: 100px 24px;
    background: white;
    border: 1px dashed rgba(0,0,0,0.12);
  }
  .auth-required h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ink); margin-bottom: 12px; }
  .auth-required p { font-size: 14px; color: rgba(0,0,0,0.55); margin-bottom: 28px; line-height: 1.6; max-width: 460px; margin-left: auto; margin-right: auto; }

  /* FOOTER */
  .site-footer { background: var(--ink); color: var(--w-72); padding: 60px 0 24px; }
  .footer-bottom { display: flex; justify-content: space-between; gap: 24px; font-size: 12px; color: var(--w-40); }
  .footer-bottom a { color: var(--w-55); }

  @media (max-width: 980px) {
    .cart-layout { grid-template-columns: 1fr; }
    .cart-summary { position: static; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
    .nav-menu { display: none; }
    .cart-item { grid-template-columns: 84px 1fr; gap: 12px; }
    .cart-item .ph { width: 84px; height: 84px; }
    .cart-item .actions { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="wrap header-row">
    <a href="../" class="logo">WOWSHIMMER</a>
    <nav class="nav-menu">
      <a href="../catalog/">Каталог</a>
      <a href="../#about">О бренде</a>
      <a href="../#where-to-buy">Где нас найти</a>
      <a href="../#contacts">Контакты</a>
    </nav>
    <div class="header-actions">
      <a href="favorites.html" class="header-icon" title="Избранное">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.5-8.5-9.5C2.3 7.8 4.5 5 7.5 5c1.8 0 3.5 1 4.5 2.5C13 6 14.7 5 16.5 5c3 0 5.2 2.8 4 6.5C18.5 16.5 12 21 12 21z"/></svg>
        <span class="fav-badge" id="fav-badge">0</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <a href="../login.html" class="header-icon" title="Вход для партнёров">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>
      </a>
    </div>
  </div>
</header>

<section class="cart-page">
  <div class="wrap" id="content"></div>
</section>

<footer class="site-footer">
  <div class="wrap"><div class="footer-bottom"><div>© WOWSHIMMER, 2026</div><div><a href="#">Политика конфиденциальности</a></div></div></div>
</footer>

<script>
  // PRODUCTS (mirror)
  const PRODUCTS = {
    'studs-8mm':      { name: 'Серьги-пусеты с кристаллами 8 мм',     price: 1490, photo: '../../img/products/studs-8mm.jpg', folder: 'studs-8mm' },
    'studs-6mm':      { name: 'Серьги-пусеты с кристаллами 6 мм',     price: 1190, photo: '../../img/products/studs-6mm.jpg', folder: 'studs-6mm' },
    'studs-4mm':      { name: 'Серьги-пусеты с кристаллами 4 мм',     price: 890,  photo: '../../img/products/studs-4mm.jpg', folder: 'studs-4mm' },
    'ear-threader':   { name: 'Серьги-протяжки с кристаллами 4 мм',  price: 1290, photo: '../../img/products/ear-threader.jpg', folder: null },
    'bar':            { name: 'Штанга с кристаллом 4 мм',             price: 990,  photo: '../../img/products/bar.jpg', folder: 'bar' },
    'pendant-thread': { name: 'Подвеска на леске с кристаллом 8 мм',  price: 1890, photo: '../../img/products/pendant-thread.jpg', folder: 'pendant-thread' },
    'pendant-chain':  { name: 'Подвеска на цепочке с кристаллом 6 мм', price: 2190, photo: '../../img/products/pendant-chain.jpg', folder: null },
    'ring':           { name: 'Кольцо с кристаллом 4 мм',             price: 1390, photo: '../../img/products/ring.jpg', folder: null }
  };

  let palette = {};
  fetch('../../img/products/_palette.json')
    .then(r => r.ok ? r.json() : null)
    .then(data => { palette = data || {}; render(); });

  // Favorites badge sync (different from cart badge)
  (function() {
    function getFavs() { try { return JSON.parse(localStorage.getItem('wowshimmer-favs') || '[]'); } catch { return []; } }
    const badge = document.getElementById('fav-badge');
    const n = getFavs().length;
    badge.textContent = n;
    badge.classList.toggle('show', n > 0);
  })();

  function photoFor(slug, colorIdx) {
    const p = PRODUCTS[slug];
    if (!p) return '';
    if (p.folder && palette[slug] && palette[slug][colorIdx]) {
      return `../../img/products/${p.folder}/${palette[slug][colorIdx].file}`;
    }
    return p.photo;
  }
  function colorHex(slug, colorIdx) {
    if (palette[slug] && palette[slug][colorIdx]) return palette[slug][colorIdx].color;
    return null;
  }

  const MIN = (window.wsPartner && window.wsPartner.MIN_SUM) || 15000;

  function render() {
    const root = document.getElementById('content');
    const auth = window.wsPartner && window.wsPartner.getAuth();

    if (!auth) {
      root.innerHTML = `
        <div class="auth-required">
          <h2>Подборка доступна только&nbsp;партнёрам</h2>
          <p>Войдите в&nbsp;партнёрский кабинет, чтобы собирать заявки с&nbsp;оптовыми ценами.</p>
          <a href="../login.html" class="empty"><button class="btn-cta" style="display:inline-block;padding:14px 32px;background:#0a0a0a;color:white;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;">Войти</button></a>
        </div>
      `;
      return;
    }

    const cart = window.wsPartner.getCart();
    if (!cart.length) {
      root.innerHTML = `
        <div class="cart-head">
          <div><h1>Подборка</h1><div class="count"><b>0</b> позиций</div></div>
        </div>
        <div class="empty">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 016 0v2"/></svg>
          <h2>Подборка пуста</h2>
          <p>Зайдите в&nbsp;каталог, откройте товар, выберите оттенок и&nbsp;количество — позиции будут добавлены сюда.</p>
          <a href="../catalog/" class="btn-cta">Перейти в&nbsp;каталог</a>
        </div>
      `;
      return;
    }

    const sum = cart.reduce((s, it) => s + (window.wsPartner.wholesalePrice(it.retail) * it.qty), 0);
    const count = cart.reduce((s, it) => s + it.qty, 0);
    const progress = Math.min(100, (sum / MIN) * 100);
    const remaining = Math.max(0, MIN - sum);
    const canSend = sum >= MIN;

    const itemsHTML = cart.map((it, i) => {
      const p = PRODUCTS[it.slug] || {};
      const itemPrice = window.wsPartner.wholesalePrice(it.retail);
      const lineTotal = itemPrice * it.qty;
      const cHex = colorHex(it.slug, it.colorIdx);
      const colorCode = (it.colorIdx != null) ? `#${String(it.colorIdx + 1).padStart(2,'0')}` : '';
      const matLabel = it.material === 'gold' ? 'позолота' : (it.material === 'steel' ? 'сталь' : '');
      const sizeLabel = it.size ? `размер ${it.size}` : '';
      const params = [
        cHex ? `<span><span class="sw" style="background:${cHex}"></span>оттенок ${colorCode}</span>` : '',
        matLabel ? `<span>${matLabel}</span>` : '',
        sizeLabel ? `<span>${sizeLabel}</span>` : ''
      ].filter(Boolean).join('');
      return `
        <div class="cart-item">
          <div class="ph"><img src="${photoFor(it.slug, it.colorIdx)}" alt="${p.name || ''}" loading="lazy"></div>
          <div class="meta">
            <div class="name">${p.name || it.slug}</div>
            <div class="params">${params}</div>
            <div class="price" style="margin-top:8px">${itemPrice.toLocaleString('ru-RU')} ₽ × ${it.qty} = <b style="color:#0a0a0a">${lineTotal.toLocaleString('ru-RU')} ₽</b></div>
          </div>
          <div class="actions">
            <div class="qty-ctrl">
              <button type="button" data-action="dec" data-i="${i}">−</button>
              <input type="number" value="${it.qty}" min="1" data-i="${i}">
              <button type="button" data-action="inc" data-i="${i}">+</button>
            </div>
            <button class="remove" type="button" data-action="remove" data-i="${i}">Удалить</button>
          </div>
        </div>
      `;
    }).join('');

    root.innerHTML = `
      <div class="cart-head">
        <div>
          <h1>Подборка</h1>
          <div class="count"><b>${count}</b> ${plural(count, 'позиция','позиции','позиций')} · ${cart.length} ${plural(cart.length,'товар','товара','товаров')}</div>
        </div>
      </div>
      <div class="cart-layout">
        <div class="cart-items">${itemsHTML}</div>
        <aside class="cart-summary">
          <h3>Итого</h3>
          <div class="summary-row"><span>Позиций</span><span>${count}</span></div>
          <div class="summary-row total"><span>Сумма</span><span class="val">${sum.toLocaleString('ru-RU')} ₽</span></div>
          <div class="min-sum-block">
            <div class="min-sum-label">
              <span>До минимальной заявки</span>
              <span><b>${sum.toLocaleString('ru-RU')}</b> / ${MIN.toLocaleString('ru-RU')} ₽</span>
            </div>
            <div class="min-sum-bar ${canSend ? 'full' : ''}"><div class="fill" style="width:${progress}%"></div></div>
            <div class="min-sum-hint ${canSend ? 'ok' : ''}">
              ${canSend ? '✓ Минимум набран — можно отправлять менеджеру' : `Добавьте ещё на ${remaining.toLocaleString('ru-RU')} ₽, чтобы оформить заявку`}
            </div>
          </div>
          <form class="send-form" id="send-form">
            <div class="field">
              <input type="text" id="ship-addr" placeholder=" " required value="Москва, ул. Большая Дмитровка, 12">
              <label for="ship-addr">Адрес доставки</label>
            </div>
            <div class="field">
              <input type="text" id="ship-date" placeholder=" ">
              <label for="ship-date">Желаемая дата отгрузки</label>
            </div>
            <div class="field">
              <textarea id="ship-comment" placeholder=" "></textarea>
              <label for="ship-comment">Комментарий</label>
            </div>
            <button type="submit" class="btn-send" ${canSend ? '' : 'disabled'}>
              ${canSend ? 'Отправить менеджеру →' : 'Минимум не набран'}
            </button>
          </form>
        </aside>
      </div>
    `;

    // Wire actions
    root.querySelectorAll('[data-action="inc"]').forEach(b =>
      b.addEventListener('click', () => {
        const i = parseInt(b.dataset.i);
        window.wsPartner.updateQty(i, window.wsPartner.getCart()[i].qty + 1);
        render();
      })
    );
    root.querySelectorAll('[data-action="dec"]').forEach(b =>
      b.addEventListener('click', () => {
        const i = parseInt(b.dataset.i);
        const cur = window.wsPartner.getCart()[i].qty;
        if (cur > 1) { window.wsPartner.updateQty(i, cur - 1); render(); }
      })
    );
    root.querySelectorAll('.qty-ctrl input').forEach(inp =>
      inp.addEventListener('change', () => {
        const i = parseInt(inp.dataset.i);
        const v = Math.max(1, parseInt(inp.value) || 1);
        window.wsPartner.updateQty(i, v);
        render();
      })
    );
    root.querySelectorAll('[data-action="remove"]').forEach(b =>
      b.addEventListener('click', () => {
        const i = parseInt(b.dataset.i);
        window.wsPartner.removeFromCart(i);
        render();
      })
    );

    const form = document.getElementById('send-form');
    if (form) form.addEventListener('submit', e => {
      e.preventDefault();
      if (!canSend) return;
      const name = (auth.name || 'партнёр').split(' ')[0];
      window.wsPartner.setCart([]);
      root.innerHTML = `
        <div class="success">
          <div class="check"><svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 8"/></svg></div>
          <h2>Заявка отправлена</h2>
          <p>Спасибо, ${name}! Состав подборки и&nbsp;данные доставки ушли менеджеру. Свяжемся в&nbsp;течение рабочего дня для&nbsp;подтверждения.<br><br>В&nbsp;демо-режиме настоящего письма не&nbsp;отправляется — это произойдёт после переноса на&nbsp;боевой домен.</p>
          <a href="../catalog/" class="btn-cta" style="display:inline-block;padding:14px 32px;background:#0a0a0a;color:white;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;">Вернуться в&nbsp;каталог</a>
        </div>
      `;
    });
  }

  function plural(n, one, few, many) {
    n = Math.abs(n) % 100;
    const n1 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n1 > 1 && n1 < 5) return few;
    if (n1 === 1) return one;
    return many;
  }

  // Re-render on auth or cart change
  document.addEventListener('ws-auth-change', render);
  document.addEventListener('ws-cart-change', render);
  // Initial render before palette loads (palette adds color photos but page works without it)
  render();
</script>

<script src="../partner.js"></script>
<script src="../modals.js"></script>
</body>
</html>
