<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История заявок · WOWSHIMMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css?v=5">
<style>
  .orders-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .orders-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 36px; color: var(--ink); line-height: 1.1; letter-spacing: -0.3px; }
  .orders-head .count { font-size: 13px; color: rgba(0,0,0,0.55); }
  .orders-head .count b { color: var(--ink); }

  .filter-tabs { display: flex; gap: 24px; border-bottom: 1px solid rgba(0,0,0,0.10); margin-bottom: 24px; overflow-x: auto; }
  .filter-tabs button {
    background: transparent; border: none;
    padding: 12px 0; margin-bottom: -1px;
    font-size: 12px; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(0,0,0,0.50);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .filter-tabs button.active { color: var(--ink); border-bottom-color: var(--gold); }

  .order-row {
    background: white;
    border: 1px solid rgba(0,0,0,0.06);
    padding: 18px 22px;
    display: grid;
    grid-template-columns: 130px 1fr auto auto;
    gap: 24px;
    align-items: center;
    margin-bottom: 12px;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .order-row:hover { border-color: var(--gold); transform: translateY(-2px); }
  .order-row .o-id { font-family: 'Inter', monospace; font-size: 13px; font-weight: 600; color: var(--ink); }
  .order-row .o-date { font-size: 12px; color: rgba(0,0,0,0.50); margin-top: 4px; letter-spacing: 0.3px; }
  .order-row .o-items { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .order-row .o-thumbs { display: flex; flex-shrink: 0; }
  .order-row .o-thumbs img { width: 44px; height: 44px; object-fit: cover; background: #f9f7f1; border: 2px solid white; border-radius: 50%; }
  .order-row .o-thumbs img:not(:first-child) { margin-left: -12px; }
  .order-row .o-thumbs .more { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.06); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.55); border: 2px solid white; margin-left: -12px; }
  .order-row .o-summary { font-size: 13px; color: rgba(0,0,0,0.65); }
  .order-row .o-summary b { color: var(--ink); }
  .order-row .o-sum { font-size: 16px; font-weight: 600; color: var(--ink); text-align: right; }
  .order-row .o-status { font-size: 11px; padding: 5px 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; text-align: center; }
  .order-row .o-status.new { background: rgba(201,169,110,0.12); color: var(--gold-deep); }
  .order-row .o-status.work { background: rgba(0,100,180,0.10); color: #0073B5; }
  .order-row .o-status.shipped { background: rgba(74,142,74,0.12); color: #4A8E4A; }
  .order-row .o-status.archived { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.50); }
  .order-row .o-arrow { color: rgba(0,0,0,0.30); font-size: 18px; transition: transform 0.2s, color 0.2s; }
  .order-row:hover .o-arrow { color: var(--gold-deep); transform: translateX(4px); }

  .empty-orders { text-align: center; padding: 70px 24px; background: white; border: 1px dashed rgba(0,0,0,0.12); font-size: 14px; color: rgba(0,0,0,0.55); }

  @media (max-width: 700px) {
    .order-row { grid-template-columns: 1fr; gap: 12px; }
    .order-row .o-sum, .order-row .o-status { text-align: left; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="../" class="logo">WOWSHIMMER</a>
    <nav class="nav-menu">
      <a href="../catalog/">Каталог</a>
      <a href="../about/">О бренде</a>
      <a href="../partners/">Партнёрам</a>
      <a href="../contacts/">Контакты</a>
    </nav>
    <div class="header-actions">
      <a href="../catalog/favorites.html" class="header-icon" title="Избранное">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.5-8.5-9.5C2.3 7.8 4.5 5 7.5 5c1.8 0 3.5 1 4.5 2.5C13 6 14.7 5 16.5 5c3 0 5.2 2.8 4 6.5C18.5 16.5 12 21 12 21z"/></svg>
        <span class="fav-badge" id="fav-badge">0</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <a href="../login.html" class="header-icon" title="Вход для партнёров">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>
      </a>
    </div>
  </div>
</header>

<section class="cabinet">
  <div class="wrap" id="content"></div>
</section>

<footer class="site-footer">
  <div class="wrap"><div class="footer-bottom"><div>© WOWSHIMMER, 2026</div><div><a href="#">Политика конфиденциальности</a></div></div></div>
</footer>

<script>
  (function() {
    try {
      const n = JSON.parse(localStorage.getItem('wowshimmer-favs') || '[]').length;
      const b = document.getElementById('fav-badge');
      b.textContent = n; b.classList.toggle('show', n > 0);
    } catch {}
  })();

  // Demo orders
  const ORDERS = [
    { id: 'WSH-2026-0042', date: '15 мая 2026', sum: 28400, items: 7, status: 'shipped', photos: ['../../img/products/studs-8mm.jpg','../../img/products/pendant-thread.jpg','../../img/products/ring.jpg','../../img/products/bar.jpg'] },
    { id: 'WSH-2026-0038', date: '8 мая 2026', sum: 19200, items: 4, status: 'work', photos: ['../../img/products/studs-6mm.jpg','../../img/products/bar.jpg'] },
    { id: 'WSH-2026-0031', date: '24 апреля 2026', sum: 32600, items: 9, status: 'shipped', photos: ['../../img/products/studs-4mm.jpg','../../img/products/ear-threader.jpg','../../img/products/pendant-chain.jpg','../../img/products/ring.jpg'] },
    { id: 'WSH-2026-0024', date: '8 апреля 2026', sum: 16800, items: 5, status: 'shipped', photos: ['../../img/products/studs-8mm.jpg','../../img/products/pendant-thread.jpg'] },
    { id: 'WSH-2026-0019', date: '25 марта 2026', sum: 22400, items: 6, status: 'archived', photos: ['../../img/products/studs-6mm.jpg','../../img/products/ring.jpg','../../img/products/bar.jpg'] },
    { id: 'WSH-2026-0011', date: '12 марта 2026', sum: 18000, items: 5, status: 'archived', photos: ['../../img/products/studs-4mm.jpg','../../img/products/ear-threader.jpg'] }
  ];
  const STATUS_LABEL = { new: 'Новая', work: 'В работе', shipped: 'Отгружена', archived: 'Архив' };

  let activeFilter = 'all';

  function render() {
    const root = document.getElementById('content');
    const auth = window.wsPartner && window.wsPartner.getAuth();

    if (!auth) {
      root.innerHTML = `
        <div class="auth-required">
          <h2>История заявок доступна только&nbsp;партнёрам</h2>
          <p>Войдите в&nbsp;партнёрский кабинет, чтобы посмотреть свои заявки и&nbsp;их&nbsp;статусы.</p>
          <a href="../login.html" class="btn-cta">Войти</a>
        </div>
      `;
      return;
    }

    const cart = window.wsPartner.getCart();
    const cartCount = cart.reduce((s, x) => s + x.qty, 0);

    const counts = {
      all: ORDERS.length,
      work: ORDERS.filter(o => o.status === 'work' || o.status === 'new').length,
      shipped: ORDERS.filter(o => o.status === 'shipped').length,
      archived: ORDERS.filter(o => o.status === 'archived').length
    };

    let list = ORDERS;
    if (activeFilter === 'work') list = ORDERS.filter(o => o.status === 'work' || o.status === 'new');
    else if (activeFilter === 'shipped') list = ORDERS.filter(o => o.status === 'shipped');
    else if (activeFilter === 'archived') list = ORDERS.filter(o => o.status === 'archived');

    const rowsHTML = list.length ? list.map(o => `
      <div class="order-row" onclick="alert('Демо: тут откроется детальная карточка заявки ${o.id}')">
        <div>
          <div class="o-id">${o.id}</div>
          <div class="o-date">${o.date}</div>
        </div>
        <div class="o-items">
          <div class="o-thumbs">
            ${o.photos.slice(0,3).map(p => `<img src="${p}" alt="">`).join('')}
            ${o.photos.length > 3 ? `<div class="more">+${o.photos.length - 3}</div>` : ''}
          </div>
          <div class="o-summary"><b>${o.items}</b> позиций</div>
        </div>
        <div class="o-sum">${o.sum.toLocaleString('ru-RU')} ₽</div>
        <div class="o-status ${o.status}">${STATUS_LABEL[o.status]}</div>
      </div>
    `).join('') : '<div class="empty-orders">В этой категории заявок пока нет.</div>';

    root.innerHTML = `
      <div class="cabinet-layout">
        <aside class="cab-nav">
          <div class="cab-nav-profile-head">
            <div class="cab-avatar">${auth.avatarUrl ? `<img src="${auth.avatarUrl}" alt="">` : (auth.name || 'П').trim().charAt(0).toUpperCase()}</div>
            <div class="cab-nav-head">${auth.name || 'Партнёр'}</div>
            <div class="cab-nav-sub">${auth.company || ''}</div>
          </div>
          <ul class="cab-nav-list">
            <li onclick="location.href='./profile.html'"><span>Профиль</span></li>
            <li data-open-cart><span>Корзина</span>${cartCount > 0 ? `<span class="count">${cartCount}</span>` : ''}</li>
            <li class="active"><span>История заявок</span><span class="count">${ORDERS.length}</span></li>
          </ul>
          <button class="cab-nav-logout" type="button" id="logout">Выйти</button>
        </aside>

        <div class="cab-main">
          <div class="orders-head">
            <h1>История заявок</h1>
            <div class="count"><b>${ORDERS.length}</b> заявок · оборот ${ORDERS.reduce((s,o)=>s+o.sum,0).toLocaleString('ru-RU')} ₽</div>
          </div>

          <div class="filter-tabs">
            <button data-f="all" class="${activeFilter === 'all' ? 'active' : ''}">Все · ${counts.all}</button>
            <button data-f="work" class="${activeFilter === 'work' ? 'active' : ''}">В работе · ${counts.work}</button>
            <button data-f="shipped" class="${activeFilter === 'shipped' ? 'active' : ''}">Отгружены · ${counts.shipped}</button>
            <button data-f="archived" class="${activeFilter === 'archived' ? 'active' : ''}">Архив · ${counts.archived}</button>
          </div>

          <div class="orders-list">${rowsHTML}</div>
        </div>
      </div>
    `;

    document.querySelectorAll('[data-f]').forEach(b => {
      b.addEventListener('click', () => { activeFilter = b.dataset.f; render(); });
    });
    document.getElementById('logout')?.addEventListener('click', () => {
      window.wsPartner.clearAuth();
      window.wsPartner.setCart([]);
      location.href = '../';
    });
  }

  document.addEventListener('ws-auth-change', render);
  if (window.wsPartnerReady) render();
  else document.addEventListener('ws-partner-ready', render);
</script>

<script src="../partner.js"></script>
<script src="../modals.js"></script>
</body>
</html>
