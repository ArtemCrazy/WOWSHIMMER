<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет партнёра · WOWSHIMMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css?v=5">
<style>
  /* Dashboard-specific */
  .hello-card {
    background: var(--ink);
    color: var(--w-92);
    padding: 40px 40px 36px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .hello-card::after {
    content: '';
    position: absolute;
    right: -100px; top: -50px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(201,169,110,0.16), transparent 60%);
    pointer-events: none;
  }
  .hello-card .greet { font-size: 12px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
  .hello-card h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 4vw, 44px); color: var(--white); line-height: 1.1; margin-bottom: 12px; }
  .hello-card p { font-size: 14px; color: var(--w-72); max-width: 540px; line-height: 1.65; }
  .hello-card .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
  .hello-card .btn { padding: 13px 24px; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: background 0.2s, color 0.2s; }
  .hello-card .btn-gold { background: var(--gold); color: var(--ink); border: none; }
  .hello-card .btn-gold:hover { background: white; }
  .hello-card .btn-outline { background: transparent; color: white; border: 1px solid var(--w-22); }
  .hello-card .btn-outline:hover { border-color: var(--gold); }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .stat-card { background: white; border: 1px solid rgba(0,0,0,0.06); padding: 22px 24px; }
  .stat-card .stat-label { font-size: 11px; color: rgba(0,0,0,0.50); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-weight: 500; }
  .stat-card .stat-value { font-family: var(--font-display); font-size: 32px; font-weight: 400; color: var(--ink); line-height: 1; }
  .stat-card .stat-value .small { font-size: 18px; color: rgba(0,0,0,0.55); }
  .stat-card .stat-note { font-size: 12px; color: rgba(0,0,0,0.55); margin-top: 6px; }

  .recent-orders { list-style: none; }
  .recent-orders li {
    display: grid;
    grid-template-columns: 70px 1fr auto auto;
    gap: 16px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .recent-orders li:last-child { border-bottom: none; }
  .recent-orders .thumb-stack { display: flex; }
  .recent-orders .thumb-stack img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid white; background: #f9f7f1; }
  .recent-orders .thumb-stack img:not(:first-child) { margin-left: -10px; }
  .recent-orders .order-id { font-size: 13px; color: rgba(0,0,0,0.65); font-weight: 500; }
  .recent-orders .order-id .num { color: var(--ink); }
  .recent-orders .order-date { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 2px; }
  .recent-orders .order-sum { font-size: 14px; color: var(--ink); font-weight: 600; }
  .recent-orders .order-status { font-size: 11px; padding: 4px 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; }
  .recent-orders .order-status.new { background: rgba(201,169,110,0.12); color: var(--gold-deep); }
  .recent-orders .order-status.work { background: rgba(0,100,180,0.10); color: #0073B5; }
  .recent-orders .order-status.shipped { background: rgba(74,142,74,0.12); color: #4A8E4A; }
  .see-all { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--gold-deep); letter-spacing: 1px; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .see-all:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .stat-row { grid-template-columns: 1fr; }
    .recent-orders li { grid-template-columns: 56px 1fr; gap: 12px; }
    .recent-orders .order-sum, .recent-orders .order-status { grid-column: 2; }
  }
</style>
</head>
<body>

<!-- HEADER (общий — будет переключен partner.js при auth) -->
<header class="site-header">
  <div class="wrap header-row">
    <a href="../" class="logo">WOWSHIMMER</a>
    <nav class="nav-menu">
      <a href="../catalog/">Каталог</a>
      <a href="../about/">О бренде</a>
      <a href="../partners/">Партнёрам</a>
      <a href="../contacts/">Контакты</a>
    </nav>
    <div class="header-actions">
      <a href="../catalog/favorites.html" class="header-icon" title="Избранное">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.5-8.5-9.5C2.3 7.8 4.5 5 7.5 5c1.8 0 3.5 1 4.5 2.5C13 6 14.7 5 16.5 5c3 0 5.2 2.8 4 6.5C18.5 16.5 12 21 12 21z"/></svg>
        <span class="fav-badge" id="fav-badge">0</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <a href="../login.html" class="header-icon" title="Вход для партнёров">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>
      </a>
    </div>
  </div>
</header>

<section class="cabinet">
  <div class="wrap" id="content"></div>
</section>

<footer class="site-footer">
  <div class="wrap"><div class="footer-bottom"><div>© WOWSHIMMER, 2026</div><div><a href="#">Политика конфиденциальности</a></div></div></div>
</footer>

<script>
  // Favorites badge sync
  (function() {
    try {
      const n = JSON.parse(localStorage.getItem('wowshimmer-favs') || '[]').length;
      const b = document.getElementById('fav-badge');
      b.textContent = n; b.classList.toggle('show', n > 0);
    } catch {}
  })();

  function render() {
    const root = document.getElementById('content');
    const auth = window.wsPartner && window.wsPartner.getAuth();

    if (!auth) {
      root.innerHTML = `
        <div class="auth-required">
          <h2>Кабинет доступен только&nbsp;партнёрам</h2>
          <p>Войдите в&nbsp;партнёрский кабинет, чтобы увидеть дашборд, историю заявок и&nbsp;управлять профилем.</p>
          <a href="../login.html" class="btn-cta">Войти</a>
        </div>
      `;
      return;
    }

    const cart = window.wsPartner.getCart();
    const cartCount = cart.reduce((s, x) => s + x.qty, 0);
    const cartSum = cart.reduce((s, x) => s + window.wsPartner.wholesalePrice(x.retail) * x.qty, 0);

    // Demo recent orders
    const orders = [
      { id: 'WSH-2026-0042', date: '15 мая 2026', sum: 28400, status: 'shipped', items: ['../../img/products/studs-8mm.jpg','../../img/products/pendant-thread.jpg','../../img/products/ring.jpg'] },
      { id: 'WSH-2026-0038', date: '8 мая 2026', sum: 19200, status: 'work', items: ['../../img/products/studs-6mm.jpg','../../img/products/bar.jpg'] },
      { id: 'WSH-2026-0031', date: '24 апреля 2026', sum: 32600, status: 'shipped', items: ['../../img/products/studs-4mm.jpg','../../img/products/ear-threader.jpg','../../img/products/pendant-chain.jpg'] }
    ];
    const statusLabel = { new: 'Новая', work: 'В работе', shipped: 'Отгружена' };

    const ordersHTML = orders.map(o => `
      <li>
        <div class="thumb-stack">${o.items.slice(0,3).map(s => `<img src="${s}" alt="">`).join('')}</div>
        <div>
          <div class="order-id"><span class="num">${o.id}</span></div>
          <div class="order-date">${o.date}</div>
        </div>
        <div class="order-sum">${o.sum.toLocaleString('ru-RU')} ₽</div>
        <div class="order-status ${o.status}">${statusLabel[o.status]}</div>
      </li>
    `).join('');

    root.innerHTML = `
      <div class="cabinet-layout">
        <aside class="cab-nav">
          <div class="cab-nav-profile-head">
            <div class="cab-avatar">${auth.avatarUrl ? `<img src="${auth.avatarUrl}" alt="">` : (auth.name || 'П').trim().charAt(0).toUpperCase()}</div>
            <div class="cab-nav-head">${auth.name || 'Партнёр'}</div>
            <div class="cab-nav-sub">${auth.company || ''}</div>
          </div>
          <ul class="cab-nav-list">
            <li onclick="location.href='./profile.html'"><span>Профиль</span></li>
            <li class="active"><span>Дашборд</span></li>
            <li data-open-cart><span>Корзина</span>${cartCount > 0 ? `<span class="count">${cartCount}</span>` : ''}</li>
            <li onclick="location.href='./orders.html'"><span>История заявок</span><span class="count">${orders.length}</span></li>
          </ul>
          <button class="cab-nav-logout" type="button" id="logout">Выйти</button>
        </aside>

        <div class="cab-main">
          <div class="hello-card">
            <div class="greet">Партнёрский кабинет</div>
            <h1>Здравствуйте, ${auth.name || 'партнёр'}</h1>
            <p>В&nbsp;каталоге открыты оптовые цены. Соберите корзину и&nbsp;отправьте менеджеру — мы&nbsp;свяжемся в&nbsp;течение рабочего дня для&nbsp;подтверждения.</p>
            <div class="actions">
              <a href="../catalog/" class="btn btn-gold">К&nbsp;каталогу →</a>
              <a href="../catalog/cart.html" class="btn btn-outline">В&nbsp;корзину</a>
            </div>
          </div>

          <div class="stat-row">
            <div class="stat-card">
              <div class="stat-label">В корзине</div>
              <div class="stat-value">${cartCount}<span class="small"> поз.</span></div>
              <div class="stat-note">${cartSum > 0 ? `${cartSum.toLocaleString('ru-RU')} ₽ из 15 000 ₽` : 'пока пусто'}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Всего заявок</div>
              <div class="stat-value">${orders.length}</div>
              <div class="stat-note">с начала сотрудничества</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Оборот за квартал</div>
              <div class="stat-value">${(orders.reduce((s,o)=>s+o.sum,0)).toLocaleString('ru-RU')}<span class="small"> ₽</span></div>
              <div class="stat-note">апрель–май 2026</div>
            </div>
          </div>

          <div class="cab-section">
            <h2>Последние заявки</h2>
            <ul class="recent-orders">${ordersHTML}</ul>
            <a href="./orders.html" class="see-all">Вся история →</a>
          </div>
        </div>
      </div>
    `;

    document.getElementById('logout')?.addEventListener('click', () => {
      window.wsPartner.clearAuth();
      window.wsPartner.setCart([]);
      location.href = '../';
    });
  }

  document.addEventListener('ws-auth-change', render);
  if (window.wsPartnerReady) render();
  else document.addEventListener('ws-partner-ready', render);
</script>

<script src="../partner.js"></script>
<script src="../modals.js"></script>
</body>
</html>
